name: "mysql"

x-action-mysql: &mysql-action
  networks:
    - mysql_network
  environment:
    MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
    MYSQL_DATABASE: ${MYSQL_DATABASE:-alfred}
    MYSQL_USER: ${MYSQL_USER:-alfred}
    MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    TZ: ${TZ:-Europe/Lisbon}
  volumes:
    - mysql:/var/lib/mysql

services:
  mysql_db:
    <<: *mysql-action
    image: mysql:${MYSQL_VERSION:-8.4}
    container_name: mysql_db
    hostname: mysql
    restart: unless-stopped
    networks:
      - mysql_network
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent || exit 1" ]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

networks:
  mysql_network:
    name: "mysql_network"

volumes:
  mysql:
